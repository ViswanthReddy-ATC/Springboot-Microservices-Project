
spring.application.name=configServer
server.port=8888

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

# Eureka Instance Configuration
eureka.instance.hostname=config-server
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=8888
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}

# Git Configuration
spring.cloud.config.server.git.uri=https://github.com/ViswanthReddy-ATC/Configurations
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
